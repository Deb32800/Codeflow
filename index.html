<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeFlow | Story Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/style.css" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Fredoka', 'sans-serif'], // Playful font
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              paper: '#FFFFFF',
              ink: '#18181b', 
              'comic-blue': '#bae6fd',
              'comic-pink': '#fbcfe8',
              'comic-yellow': '#fde68a',
              'comic-green': '#bbf7d0',
              'comic-purple': '#e9d5ff',
              border: '#e4e4e7',
            },
            boxShadow: {
              'comic': '4px 4px 0px 0px rgba(0,0,0,1)',
              'comic-hover': '6px 6px 0px 0px rgba(0,0,0,1)',
              'comic-sm': '2px 2px 0px 0px rgba(0,0,0,1)',
            },
            animation: {
              'bounce-in': 'bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              bounceIn: {
                '0%': { transform: 'scale(0.3)', opacity: '0' },
                '80%': { transform: 'scale(1.05)' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #f8fafc; color: #18181b; }
      
      /* Playful Scrollbar */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #f1f5f9; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; border: 2px solid #f1f5f9; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      
      .react-flow__node { 
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
      }
      
      .react-flow__attribution { display: none !important; }
      
      /* Grid Pattern for Background */
      .bg-grid {
        background-size: 40px 40px;
        background-image: linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                          linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "jszip": "https://aistudiocdn.com/jszip@^3.10.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "reactflow/": "https://aistudiocdn.com/reactflow@^11.11.4/",
    "reactflow": "https://aistudiocdn.com/reactflow@^11.11.4",
    "clsx": "https://aistudiocdn.com/clsx@^2.1.1",
    "tailwind-merge": "https://aistudiocdn.com/tailwind-merge@^2.3.0",
    "dagre": "https://aistudiocdn.com/dagre@^0.8.5",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^11.0.8"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-50 text-slate-900 overflow-hidden selection:bg-yellow-200 selection:text-black">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
